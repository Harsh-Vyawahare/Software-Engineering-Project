services:
  postgres:
    image: postgres:16-alpine
    container_name: spit-attend-postgres
    restart: always
    environment:
      POSTGRES_USER: spit_user
      POSTGRES_PASSWORD: spit_password
      POSTGRES_DB: spit_attend_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
